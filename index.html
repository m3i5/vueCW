<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
        .card {
            margin: auto;
            width: 450px;
            top:50%;
            padding: 20px;
            border: 2px solid blue;
            
            display: flex;
            flex-direction: row;
            justify-content: space-around;
        }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <div id="myApp">
      <div class="card">
        <div class="info">
            <h3>{{module.subject}}</h3>
            <p>{{module.tutor}}</p>
            <p>{{module.location}}</p>
            <p>{{module.price}}</p>
        </div>
       
        <img :src="module.image" :alt="altText" width="200" />
      </div>
    </div>

    <script type="module">
      const { createApp } = Vue;
      const myApp = createApp({
        data() {
          return {
            module: {
              subject: "Calculus I",
              tutor: "Isaac Newton",
              location: "Online",
              price: "£25",
              image: "./images/calculus.jpg",
              altText: "Image of integrals being solved"
            },
          };
        },
      });

      myApp.mount("#myApp");
    </script>
  </body>
</html>
