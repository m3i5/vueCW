<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
        .card {
            margin: auto;
            width: 450px;
            top:50%;
            padding: 20px;
            border: 2px solid blue;
            
            display: flex;
            flex-direction: row;
            justify-content: space-around;
        }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>


    <div id="myApp">
      <div>
        <p>Cart: {{cartQuantity}}</p>
      </div>
      <div class="card">
        <div class="info">
            <h3>{{lesson.subject}}</h3>
            <p>{{lesson.tutor}}</p>
            <p>{{lesson.location}}</p>
            <p>{{lesson.price}}</p>
            <p>Available: {{lesson.quantity}}</p>
        </div>
        <img :src="lesson.image" :alt="altText" width="200" />

        <button @click="addToCart(lesson)" :disabled="!canAddToCart">Add</button>
      </div>

    </div>

    <script type="module">
      const { createApp } = Vue;
      const myApp = createApp({
        data() {
          return {
            lesson: {
              id: "1001",
              quantity: 10,
              subject: "Calculus I",
              tutor: "Isaac Newton",
              location: "Online",
              price: "£25",
              image: "./images/calculus.jpg",
              altText: "Image of integrals being solved",
            },
            cart: [],
          };
        },
        computed: {
          cartQuantity: function() {
            return this.cart.length
          },
          canAddToCart: function() {
            return this.lesson.quantity > 0 ? true : false;
          }
        },
        methods: {
          addToCart(lesson) {
            this.cart.push(lesson.id);
            this.lesson.quantity--;
            console.log(this.canAddToCart)
          }
        }
      });

      myApp.mount("#myApp");
    </script>
  </body>
</html>
